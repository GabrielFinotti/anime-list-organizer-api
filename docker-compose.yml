version: '3.8'

services:
  # Aplicação Node.js
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: anime-list-api
    restart: unless-stopped
    ports:
      - "${PORT:-3333}:3333"
    environment:
      - NODE_ENV=production
      - PORT=3333
      - MONGODB_URI=mongodb://mongo:27017/anime-list-organizer
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - BASIC_USERNAME=${BASIC_USERNAME}
      - BASIC_PASSWORD=${BASIC_PASSWORD}
      - VERSION=${VERSION}
      - NODE_OPTIONS=${NODE_OPTIONS:---max-old-space-size=1536}
      - TZ=${TZ:-America/Recife}
    mem_limit: 1.5g
    mem_reservation: 1g
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - anime-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3333/api/v3/health", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # MongoDB
  mongo:
    image: mongo
    container_name: anime-list-mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_DATABASE: anime-list-organizer
    volumes:
      # Persistência de dados do MongoDB
      - mongo_data:/data/db
    networks:
      - anime-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    command: mongod --logpath /dev/stdout --logappend

# Volumes para persistência
volumes:
  mongo_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH:-./data/mongo}

# Rede isolada para os serviços
networks:
  anime-network:
    driver: bridge
