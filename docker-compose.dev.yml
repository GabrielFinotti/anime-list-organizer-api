services:
  mongo:
    image: mongo:latest
    container_name: mongo-dev
    expose:
      - '27017'
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:latest
    container_name: redis-dev
    expose:
      - '6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: api-dev
    command: npm run dev
    env_file: .env.development
    ports:
      - '${PORT}:3000'
    volumes:
      - ./:/app
      - /app/node_modules
    depends_on:
      - mongo
      - redis

volumes:
  mongo_data:
  redis_data:
