services:
  mongo:
    image: mongo:latest
    container_name: mongo-prod
    expose:
      - '27017'
    volumes:
      - mongo_data_prod:/data/db
    restart: unless-stopped
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:latest
    container_name: redis-prod
    expose:
      - '6379'
    volumes:
      - redis_data_prod:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: redis-cli --raw incr ping
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: anime-timeline-api
    container_name: api-prod
    command: npm start
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=${PORT}
      - VERSION=${VERSION}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - MONGO_URI=${MONGO_URI}
      - MONGO_NAME=${MONGO_NAME}
      - REDIS_URL=${REDIS_URL}
      - SECRET_KEY=${SECRET_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID}
      - CLOUDFLARE_ACCESS_KEY_ID=${CLOUDFLARE_ACCESS_KEY_ID}
      - CLOUDFLARE_SECRET_ACCESS_KEY=${CLOUDFLARE_SECRET_ACCESS_KEY}
      - CLOUDFLARE_R2_BUCKET_NAME=${CLOUDFLARE_R2_BUCKET_NAME}
      - CLOUDFLARE_R2_PUBLIC_DOMAIN=${CLOUDFLARE_R2_PUBLIC_DOMAIN}
      - TOKEN_EXPIRATION=${TOKEN_EXPIRATION}
    ports:
      - '${PORT}:${PORT}'
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: node -e "require('http').get('http://localhost:${PORT}/api/health', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

volumes:
  mongo_data_prod:
  redis_data_prod:

networks:
  default:
    name: anime-timeline-network-prod
