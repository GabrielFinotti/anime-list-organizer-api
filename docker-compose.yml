version: "3.8"

services:
  api:
    container_name: anime-list-api
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT}:${PORT}"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - anime-network
networks:
  anime-network:
    driver: bridge
