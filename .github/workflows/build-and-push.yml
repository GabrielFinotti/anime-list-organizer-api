name: Build and Push Docker Image

on:
    push:
        branches:
            - main

jobs:
    build-and-push:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKER_HUB_USERNAME }}
                  password: ${{ secrets.DOCKER_HUB_TOKEN }}

            - name: Extract version from package.json
              id: version
              run: |
                  VERSION=$(grep '"version"' package.json | head -1 | sed 's/.*"version": "\(.*\)".*/\1/' | sed 's/-dev$//')
                  echo "version=$VERSION" >> $GITHUB_OUTPUT

            - name: Build and push Docker image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  file: ./Dockerfile.prod
                  push: true
                  tags: |
                      ${{ secrets.DOCKER_HUB_USERNAME }}/anime-list-organizer-api:latest
                      ${{ secrets.DOCKER_HUB_USERNAME }}/anime-list-organizer-api:v${{ steps.version.outputs.version }}
                  cache-from: type=registry,ref=${{ secrets.DOCKER_HUB_USERNAME }}/anime-list-organizer-api:buildcache
                  cache-to: type=registry,ref=${{ secrets.DOCKER_HUB_USERNAME }}/anime-list-organizer-api:buildcache,mode=max
